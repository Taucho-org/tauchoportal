{{/* Taucho API-driven product catalog */}}
{{define "catalog-taucho"}}
<script>
if (typeof window._i18nCatalog === 'undefined') window._i18nCatalog = {};
Object.assign(window._i18nCatalog, {{i18nJSONByPrefix .I18n "catalog.common"}});
</script>
<div class="catalog-taucho brand-catalog" data-brand="taucho">
  <div class="catalog-header-section"><h2>{{.I18n.T "catalog.taucho.title"}}</h2></div>
  <div class="catalog-products-wrapper">
    <div class="loading-state" data-catalog-loading><div>⏳</div><div>{{.I18n.T "catalog.loading"}}</div></div>
    <div class="error-state" data-catalog-error hidden>
      <div>⚠️</div><div>{{.I18n.T "catalog.noResults"}}</div>
      <button type="button" class="retry-btn" data-catalog-retry>{{.I18n.T "catalog.retry"}}</button>
    </div>
    <div class="empty-state" data-catalog-empty hidden><div>📭</div><div>{{.I18n.T "catalog.noResults"}}</div></div>
    <div class="catalog-products" data-catalog-products></div>
  </div>
  <div class="catalog-footer"><span data-catalog-count></span></div>
</div>
<script>
(() => {
  const root = document.querySelector('.catalog-taucho');
  if (!root || root.dataset.initialized) return;
  root.dataset.initialized = 'true';
  const grid = root.querySelector('[data-catalog-products]');
  const loading = root.querySelector('[data-catalog-loading]');
  const error = root.querySelector('[data-catalog-error]');
  const empty = root.querySelector('[data-catalog-empty]');
  const count = root.querySelector('[data-catalog-count]');
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, character => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[character]);
  const translate = (key, values = {}) => {
    let text = window._i18nCatalog[key] || key;
    for (const [name, value] of Object.entries(values)) text = text.replaceAll(`{${name}}`, String(value));
    return text;
  };
  const actionLabels = {
    color: translate('catalog.actionColor'), set_color: translate('catalog.actionColor'),
    brightness: translate('catalog.actionBrightness'), set_brightness: translate('catalog.actionBrightness'),
    on: translate('catalog.actionPower'), off: translate('catalog.actionPower'),
    turn_on: translate('catalog.actionPower'), turn_off: translate('catalog.actionPower')
  };

  function showState(state) {
    loading.hidden = state !== 'loading';
    error.hidden = state !== 'error';
    empty.hidden = state !== 'empty';
    grid.hidden = state === 'loading' || state === 'error' || state === 'empty';
  }

  function renderProducts(products) {
    grid.innerHTML = products.map(product => {
      const name = escapeHtml(product.name);
      const category = product.category
        ? `<p class="special-product-category">${escapeHtml(translate('catalog.productCategory', { category: product.category }))}</p>`
        : '';
      const description = product.description ? `<p class="special-product-description">${escapeHtml(product.description)}</p>` : '';
      const price = product.priceRange || product.price_range || product.price;
      const priceLine = price ? `<p class="special-product-price">${escapeHtml(price)}</p>` : '';
      const actions = (product.supported_actions || []).map(action =>
        `<span class="action-tag-pill">${escapeHtml(actionLabels[action] || action)}</span>`
      ).join('');
      return `<article class="catalog-card-v2" data-product-id="${escapeHtml(product.id)}">
        <div class="product-image"><img src="${escapeHtml(product.thumbnail_url || '/image/catalog/product-placeholder.png')}" alt="${name}" loading="lazy" onerror="this.onerror=null;this.src='/image/catalog/product-placeholder.png'"></div>
        <div class="product-details">
          <div><h3>${name}</h3>${category}${description}${priceLine}${actions ? `<div class="product-actions">${actions}</div>` : ''}</div>
          <button type="button" class="btn-quick-add" data-catalog-add data-product-id="${escapeHtml(product.id)}" data-product-name="${name}">${escapeHtml(translate('catalog.addDevice'))}</button>
        </div>
      </article>`;
    }).join('');
    count.textContent = products.length
      ? translate('catalog.showingResults', { start: 1, end: products.length, total: products.length })
      : '';
    showState(products.length ? 'products' : 'empty');
  }

  async function loadProducts() {
    showState('loading');
    error.hidden = true;
    try {
      const params = new URLSearchParams({ brand_id: 'taucho', active_only: 'true', limit: '20', offset: '0', sort_by: 'name' });
      const response = await fetch(`/api/catalog/products?${params}`);
      if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      const data = await response.json();
      if (!Array.isArray(data.products)) throw new Error('Invalid catalog response');
      renderProducts(data.products);
    } catch (cause) {
      console.error('Error loading Taucho products:', cause);
      count.textContent = '';
      showState('error');
    }
  }

  root.addEventListener('click', event => {
    if (event.target.closest('[data-catalog-retry]')) loadProducts();
    const button = event.target.closest('[data-catalog-add]');
    if (button && window.selectProduct) {
      window.selectProduct('taucho', button.dataset.productId, button.dataset.productName);
    }
  });
  loadProducts();
})();
</script>
<style>
  .catalog-taucho .catalog-header-section { padding: 12px 16px; }
  .catalog-taucho .catalog-products-wrapper { max-height: 500px; padding: 10px 12px; }
  .catalog-taucho .catalog-products { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .catalog-taucho .catalog-products[hidden] { display: none; }
  .catalog-taucho .catalog-card-v2 { min-height: 232px; }
  .catalog-taucho .product-image { flex: 0 0 34%; width: 34%; min-width: 210px; max-width: 250px; height: auto; min-height: 232px; }
  .catalog-taucho .product-image img { width: 90%; height: 90%; object-fit: contain; }
  .catalog-taucho .product-details { padding: 18px 20px; gap: 14px; align-items: flex-start; }
  .catalog-taucho .product-details h3 { margin: 0 0 8px; color: #222; font-size: 20px; line-height: 1.3; }
  .catalog-taucho .special-product-category,
  .catalog-taucho .special-product-description,
  .catalog-taucho .special-product-price { margin: 0 0 8px; color: #555; font-size: 14px; line-height: 1.5; }
  .catalog-taucho .special-product-price { font-weight: 600; }
  .catalog-taucho .product-actions { margin: 10px 0 0; }
  .catalog-taucho .btn-quick-add { flex: 0 0 auto; padding: 6px 10px; }
  .catalog-taucho [data-catalog-loading][hidden],
  .catalog-taucho [data-catalog-error][hidden],
  .catalog-taucho [data-catalog-empty][hidden] { display: none; }
  @media (max-width: 520px) {
    .catalog-taucho .product-image { min-width: 130px; }
    .catalog-taucho .product-details { padding: 14px; }
    .catalog-taucho .product-details h3 { font-size: 17px; }
  }
  @media (max-width: 380px) {
    .catalog-taucho .catalog-card-v2 { flex-direction: column; }
    .catalog-taucho .product-image { width: 100%; max-width: none; min-height: 190px; height: 190px; }
  }
</style>
{{end}}
